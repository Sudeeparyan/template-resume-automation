name: Check workspace

# Checks the shareable code only, the same steps as "Check Workspace.cmd".
# It never runs a job search, never sees a profile and has nothing to do with the
# morning job list on your PC. Each step says what it checks, so a red step names
# the problem: for example "Privacy" means a private file is about to be published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CAREER_NO_SCHEDULED_TASKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Privacy: no personal files or secrets would be published"
        shell: bash
        run: python scripts/scan_release.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: career-dashboard/frontend/package-lock.json
      - name: "Setup: PDF compiler (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'tectonic-0.17.0.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'tectonic-0.17.0'
          Invoke-WebRequest -Uri 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $compiler = Get-ChildItem -LiteralPath $folder -Filter tectonic.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw 'The Tectonic archive did not include tectonic.exe.' }
          $compiler.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler.FullName --version
      - name: "Setup: PDF compiler (macOS)"
        if: runner.os == 'macOS'
        shell: bash
        run: brew install tectonic
      - name: "Setup: app dependencies, the way Start Dashboard installs them (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\Start Dashboard.cmd" --preflight-only'
      - name: "Setup: app dependencies, the way Start Dashboard installs them (macOS)"
        if: runner.os == 'macOS'
        shell: bash
        run: bash "Start Dashboard.command" --preflight-only
      - name: "Setup: test tools"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$PWD/career-dashboard/backend/.venv/Scripts/python.exe"; else PY="$PWD/career-dashboard/backend/.venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -r career-dashboard/backend/requirements-dev.txt
      - name: "Backend tests"
        shell: bash
        working-directory: career-dashboard
        run: '"$PY" -m pytest -q'
      - name: "Profiles and workspace files are valid"
        shell: bash
        run: |
          "$PY" scripts/check_profiles.py
          "$PY" career-dashboard/backend/scripts/validate_workspace.py
      - name: "Frontend tests"
        shell: bash
        working-directory: career-dashboard/frontend
        run: npm test
      - name: "Frontend build"
        shell: bash
        working-directory: career-dashboard/frontend
        run: npm run build
      - name: "First run: a fresh copy with no profiles starts and onboards"
        shell: bash
        run: '"$PY" scripts/smoke_first_run.py'
