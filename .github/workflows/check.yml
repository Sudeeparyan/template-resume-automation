name: Check workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-run:
    name: First run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CAREER_NO_SCHEDULED_TASKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: career-dashboard/frontend/package-lock.json
      - name: Install Tectonic on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'tectonic-0.17.0.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'tectonic-0.17.0'
          Invoke-WebRequest -Uri 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $compiler = Get-ChildItem -LiteralPath $folder -Filter tectonic.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw 'The Tectonic archive did not include tectonic.exe.' }
          $compiler.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler.FullName --version
      - name: Install Tectonic on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install tectonic
      - name: Check Windows first run
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\Check Workspace.cmd"'
      - name: Check macOS first run
        if: runner.os == 'macOS'
        shell: bash
        run: bash "Check Workspace.command"
