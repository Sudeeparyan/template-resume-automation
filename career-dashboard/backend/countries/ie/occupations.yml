  category: Teaching and Educational Professionals
  title: 'Academics who hold a qualification equivalent to Level 10 of the National Framework of Qualification in
    a given discipline awarded no less than two calendar years prior to the date of application for an employment
    permit, with a minimum of one academic year of relevant teaching experience, and the employment concerned

    is in a third level institution governed by the Irish Universities Act 1997 (No. 24 of 1997), the Institutes
    of Technology Act 2006 (No. 25 of 2006) and the Technological Universities Act 2018 (No. 3 of 2018); or

    involves delivering a programme largely or wholly concerned with information and communications technology,
    which leads to a major award at QQI level 8 and/or level 9 as validated by Quality and Qualifications Ireland.'
