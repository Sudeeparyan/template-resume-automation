- id: critical:2421
  list: critical
  soc3: '242'
  soc4: '2421'
  category: Business, Research and Administrative Professionals
  title: 'Chartered and certified accountants, and taxation experts specialising in tax, compliance, regulation,
    solvency or financial management or related and relevant specialist skills, qualifications or experience.

    Qualified accountants with at least three years’ auditing experience, who are full members of the American Institute
    of Certified Public Accountants (AICPA), Philippine Institute of Certified Public Accountants (PICPA) and the
    Institute of Chartered Accountants of Pakistan (ICAP) and whom have relevant work experience in the areas of
    US GAAP reporting and Global Audit and Advisory Services and the employment concerned is in MNC Global Audit
    Services.

    Tax consultant specialising in non-EEA tax consultancy and compliance with a professional tax qualification
    or legal qualification with tax specialism, and has a minimum of three years’ experience of tax consultancy
    requirements and regulations in the relevant non-EEA market.'
  qualifiers:
