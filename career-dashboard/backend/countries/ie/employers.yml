# Employers with a public careers feed and current openings in Ireland.
#
# The "feeds" search (backend/services/job_sources.py) reads these boards directly,
# without AI, and runs every posting through the same market, work-permit, duplicate,
# legitimacy and requirement checks as any other lead. A profile's own
# data/config/portals.yml tracked_companies are read first; this list is the
# country-wide starting set every Ireland profile shares.
#
# Each board was checked on 2026-09-26 and listed Irish postings that day.
# ats: greenhouse | lever | ashby -> token is the board name
#      smartrecruiters             -> token is the company identifier
#      workday                     -> host and site of the public careers site
# sectors are hints for the search plan; they never decide eligibility.

verified_on: "2026-09-26"
employers:
